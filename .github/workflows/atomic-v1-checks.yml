name: Atomic V1 native signing checks
on:
  pull_request:
    paths: ['src/**', 'base44/**', 'tests/atomic-v1/**', 'tests/atomic-v1-ui/**', 'tests/atomic-v1-react/**', 'package*.json', '.github/workflows/atomic-v1-checks.yml']
  push:
    branches: [main]
    paths: ['src/**', 'base44/**', 'tests/atomic-v1/**', 'tests/atomic-v1-ui/**', 'tests/atomic-v1-react/**', '.github/workflows/atomic-v1-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/atomic-v1/*.test.mjs
      - name: Archive tested tracked source
        if: always()
        run: git archive --format=tar HEAD src base44 tests docs package.json package-lock.json jsconfig.json eslint.config.js vite.config.js AGENTS.md README.md > tested-source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-v1-tested-source
          path: tested-source.tar
          retention-days: 7
  react-launch-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise the real React page, provider and hook in isolation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/atomic-v1-react"
          cp -R src base44 tests "$RUNNER_TEMP/atomic-v1-react/"
          cp .npmrc "$RUNNER_TEMP/atomic-v1-react/"
          cd "$RUNNER_TEMP/atomic-v1-react"
          printf '{"type":"module"}\n' > package.json
          npm install --prefix tests/atomic-v1-react --ignore-scripts --no-audit --no-fund
          node --test tests/atomic-v1-react/*.test.cjs
  sdk-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test explicitly pinned SDK imports in isolation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/atomic-v1-sdk"
          cp -R base44 tests src "$RUNNER_TEMP/atomic-v1-sdk/"
          cp tests/atomic-v1/sdk-package.json "$RUNNER_TEMP/atomic-v1-sdk/package.json"
          cd "$RUNNER_TEMP/atomic-v1-sdk"
          deno install --node-modules-dir=auto
          deno test --node-modules-dir=auto --no-check --allow-read --allow-env tests/atomic-v1/sdk.test.ts
  application:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        revision: [base, head]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'base' && (github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ls @solana/kit @solana/compat @solana/web3.js
      - run: npm run build
      - if: always()
        run: npm run lint
      - name: Public and admin submit-button regression tests
        if: matrix.revision == 'head'
        run: node --test tests/atomic-v1-ui/*.test.cjs
      - name: Typecheck with retained diagnostics
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-v1-typecheck-${{ matrix.revision }}
          path: typecheck.txt
          retention-days: 7
